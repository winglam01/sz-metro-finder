<!doctype html>
<html lang="zh-Hans">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta
      name="description"
      content="用拼音搜索深圳地铁车站，查询各线路各方向的预计到站时间、首末班车、行车间隔、出入口，并规划乘车路线。"
    />

    <!-- Standalone web app: lets iPhone add this to the Home Screen. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="深圳地铁" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#171717" media="(prefers-color-scheme: dark)" />
    <link rel="manifest" href="./manifest.json" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />

    <title>深圳地铁拼音查站</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <a class="skip-link" href="#main">跳到主要内容</a>

    <div class="layout">
      <aside class="sidebar" aria-label="主导航">
        <div class="brand">
          <span class="brand__mark" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
              <rect x="4" y="3" width="16" height="14" rx="4" />
              <path d="M7 21l2-4M17 21l-2-4" />
              <path d="M8.5 7.5h.01M15.5 7.5h.01" />
              <path d="M4 11h16" />
            </svg>
          </span>
          <span class="brand__text">
            <strong>深圳地铁拼音查站</strong>
            <span>Shenzhen Metro · arrival times</span>
          </span>
        </div>

        <nav class="nav" aria-label="分区">
          <p class="nav__label">查询</p>
          <a class="nav__item" href="#/finder" data-nav="finder">
            <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7" /><path d="m20 20-3.5-3.5" /></svg>
            <span>站点查询</span>
          </a>
          <a class="nav__item" href="#/plan" data-nav="plan">
            <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 19V5M6 6h9a3 3 0 0 1 0 6H6" /><circle cx="6" cy="19" r="1.6" /><path d="M15 12l4 3-4 3" /></svg>
            <span>乘车路线</span>
          </a>

          <p class="nav__label">网络</p>
          <a class="nav__item" href="#/network" data-nav="network">
            <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="5" cy="6" r="2.4" /><circle cx="19" cy="6" r="2.4" /><circle cx="12" cy="18" r="2.4" /><path d="M6.6 7.7l4 8.4M17.4 7.7l-4 8.4M7.4 6h9.2" /></svg>
            <span>线路车站</span>
          </a>
          <a class="nav__item" href="#/saved" data-nav="saved">
            <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 4h12v16l-6-4-6 4z" /></svg>
            <span>收藏车站</span>
          </a>
        </nav>

        <div class="sidebar__foot">
          <button class="ghost-btn" type="button" data-action="toggle-theme">
            <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4" /><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" /></svg>
            <span data-theme-label>跟随系统</span>
          </button>
          <p class="sidebar__note" data-sources>数据来自深圳地铁集团官网（szmc.net）公开接口。</p>
        </div>
      </aside>

      <div class="content">
        <main id="main" class="main" tabindex="-1"></main>
      </div>
    </div>

    <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

    <script src="./app.js" type="module"></script>
  </body>
</html>
